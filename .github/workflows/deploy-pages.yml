name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same commands as the local `npm run deploy` script (see package.json):
      # export the Expo web build, then duplicate index.html as 404.html so
      # GitHub Pages serves the SPA for any deep-linked route instead of a
      # real 404 (expo-router routes are client-side, GH Pages doesn't know
      # about them).
      #
      # Deliberately NOT passing an AI API key here. EXPO_PUBLIC_* vars get
      # inlined straight into the shipped JS bundle, which GitHub's push
      # protection (correctly) refused to let through once it spotted a
      # real key in there — anyone visiting this public site could read it
      # out of the bundle or the network tab. This public build ships with
      # AI features showing their normal "not connected" fallback; full AI
      # still works when running locally against your own .env.
      #
      # EXPO_PUBLIC_RESEARCH_LOG_ENDPOINT is different: it's not a credential
      # (the Apps Script endpoint has no auth, by design — see
      # verificationEmailClient.ts), so it's safe to ship. It's read from a
      # repository *variable* (not a secret) so it's inlined into this build
      # the same way it already is locally via .env — without it, both
      # research logging and email verification silently no-op in
      # production. One-time setup: Settings → Secrets and variables →
      # Actions → Variables → New repository variable, named exactly
      # EXPO_PUBLIC_RESEARCH_LOG_ENDPOINT.
      # TEMPORARY DIAGNOSTIC — remove once the missing-endpoint-in-prod issue
      # is confirmed fixed. Prints only the length of the resolved value
      # (never the value itself) so this is safe to leave in logs.
      - name: "[diagnostic] check repo variable resolution"
        env:
          EXPO_PUBLIC_RESEARCH_LOG_ENDPOINT: ${{ vars.EXPO_PUBLIC_RESEARCH_LOG_ENDPOINT }}
        run: |
          echo "[diagnostic] vars context value length: ${#EXPO_PUBLIC_RESEARCH_LOG_ENDPOINT}"
          if [ -z "${EXPO_PUBLIC_RESEARCH_LOG_ENDPOINT}" ]; then
            echo "[diagnostic] EXPO_PUBLIC_RESEARCH_LOG_ENDPOINT is EMPTY in this job"
          else
            echo "[diagnostic] EXPO_PUBLIC_RESEARCH_LOG_ENDPOINT is set (non-empty)"
          fi

      - name: Export web build
        env:
          EXPO_PUBLIC_RESEARCH_LOG_ENDPOINT: ${{ vars.EXPO_PUBLIC_RESEARCH_LOG_ENDPOINT }}
        run: |
          echo "[diagnostic] length seen by export step: ${#EXPO_PUBLIC_RESEARCH_LOG_ENDPOINT}"
          npx expo export --platform web
          cp dist/index.html dist/404.html

      # TEMPORARY DIAGNOSTIC — checks the actual built output in this same
      # job, removing all ambiguity about local-vs-CI or caching: does the
      # bundle Expo just wrote to disk actually contain the endpoint host?
      - name: "[diagnostic] check built bundle for the endpoint"
        run: |
          MATCHES=$(grep -rc "script.google.com" dist/_expo/static/js/web/entry-*.js || true)
          echo "[diagnostic] occurrences of script.google.com in the built entry bundle: ${MATCHES}"
          echo "[diagnostic] expo/cli version:"
          npx expo --version

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # The gh-pages branch already existed from an earlier local
          # `npm run deploy` run, with history this Action never created —
          # force_orphan replaces it with one fresh commit each deploy
          # instead of trying to reconcile against that unrelated history,
          # which is what a bare `git` exit-1 failure here usually means.
          force_orphan: true

      # GitHub Pages project-page URLs are fully determined by the repo's
      # own owner/name (https://<owner>.github.io/<repo>/) — not a per-deploy
      # preview URL — so there's nothing to look up from an API, just
      # recompute it from this run's own context every time. README.md is
      # only touched (and only committed) if that recomputed line actually
      # differs from what's there, so a normal deploy with no URL change
      # produces zero commits.
      - name: Update README with the live URL
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          LIVE_URL="https://${OWNER_LOWER}.github.io/${REPO_NAME}/"
          NEW_LINE="**Live app:** ${LIVE_URL}"
          awk -v line="$NEW_LINE" '
            /<!-- LIVE_URL_START -->/ { print; print line; skip=1; next }
            /<!-- LIVE_URL_END -->/ { skip=0 }
            !skip { print }
          ' README.md > README.md.tmp
          mv README.md.tmp README.md

      - name: Commit README if the live URL changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update live site link in README [skip ci]"
          file_pattern: README.md
          skip_dirty_check: false
